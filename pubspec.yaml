name: cc_remote
description: App para controlar, fazer slicing e enviar impressões para a Elegoo Centauri Carbon (CC1).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  crypto: ^3.0.5
  uuid: ^4.5.1
  file_picker: ^8.1.2
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.2
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  flutter_local_notifications: ^17.2.3
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/slicer/
    - assets/ai/
