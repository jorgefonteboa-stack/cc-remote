name: Construir app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android
        run: |
          flutter create --platforms=android --org com.ccremote --project-name cc_remote .
          rm -rf test   # teste de exemplo gerado pelo flutter create (não se aplica a esta app)
          python3 tools/ci_patch_android.py
          flutter pub get
          # Plugins antigos usam proguard-android.txt, recusado pelo Android Gradle Plugin atual
          grep -rl "proguard-android.txt" ~/.pub-cache/hosted/pub.dev/*/android/ 2>/dev/null \
            | xargs -r sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g"
          # Plugins antigos compilam contra SDKs < 36; as dependências atuais exigem 36
          find ~/.pub-cache/hosted/pub.dev/*/android -maxdepth 1 -name "build.gradle*" \
            | xargs -r sed -i -E "s/compileSdkVersion[ =]+[0-9]+/compileSdkVersion 36/; s/compileSdk[ ]*=[ ]*[0-9]+/compileSdk = 36/; s/compileSdk[ ]+[0-9]+/compileSdk 36/"

      - name: Análise do código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Construir APK
        run: flutter build apk --release

      - name: Guardar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk CC-Remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CC-Remote-apk
          path: CC-Remote.apk

      - name: Publicar versão para descarregar no telemóvel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: CC Remote 0.1.${{ github.run_number }}
          body: |
            Abre esta página no telemóvel Android, toca em **CC-Remote.apk** para descarregar e depois abre o ficheiro para instalar.
            (Se o Android avisar sobre "fontes desconhecidas", permite a instalação para o browser.)
          files: CC-Remote.apk
          make_latest: true
